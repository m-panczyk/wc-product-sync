name: Release

# Tag v<version> -> build the ZIP, attach it to that tag's release, and swap update.json
# on the moving `latest` release (the URL every store's updater polls).
#
# publish.sh refuses to run when the tag and the plugin header disagree, so a mistyped
# bump fails here rather than shipping metadata that points at the wrong package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.9.23'
        required: true

concurrency:
  group: wps-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    steps:
      # node:20-bookworm has node/git/curl but not php/zip; publish.sh needs python3 too.
      - name: Toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            php-cli python3 zip unzip >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # publish.sh pushes the channel tags (latest / latest-beta). Git refuses to push
          # refs out of a shallow clone, which is why the `latest` tag silently failed to
          # move on the v0.9.23 release while the asset swap succeeded.
          fetch-depth: 0

      - name: PHP syntax
        run: php -l wc-product-sync.php

      - name: Build and publish
        env:
          # A PAT with repo write access; falls back to the automatic per-run token.
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_REPO: ${{ github.repository }}
        run: ./publish.sh "${{ inputs.tag || github.ref_name }}"

      # No upload-artifact step: actions/upload-artifact@v4 needs GitHub's artifact API v2,
      # which Forgejo does not implement (GHESNotSupportedError), and it turned a successful
      # v0.9.23 release red. It was redundant anyway — publish.sh attaches the ZIP and
      # update.json to the release itself, which is the durable copy.
