name: CI

# Cheap, hermetic checks: no rig, no network, no side effects. Safe on every push.
# Anything that touches the live rig lives in rig-tests.yaml (manual/scheduled).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: self-hosted
    steps:
      # The runner label maps to node:20-bookworm (node is required by checkout).
      # php/zip are not in that image; install what the build and lint actually use.
      # TODO: bake these into a CI image and drop this step.
      - name: Toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            php-cli zip unzip >/dev/null

      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l wc-product-sync.php
          for f in tests/*.php; do php -l "$f"; done

      # Coding standards lint — non-blocking while we size the existing backlog.
      # Composer is not baked into the runner image; install it here.
      - name: PHPCS (WordPress coding standards)
        continue-on-error: true
        run: |
          curl -sS https://getcomposer.org/installer | php -- --quiet
          php composer.phar install --no-interaction --prefer-dist --optimize-autoloader
          php composer.phar phpcs -- -s

      - name: Shell syntax
        run: |
          for f in build.sh publish.sh tests/*.sh; do bash -n "$f"; done

      # Builds the real package. Catches a broken INCLUDE list (e.g. a file that
      # exists locally but was never committed) before it reaches a release.
      - name: Package builds
        run: ./build.sh

      - name: Plugin header version is sane
        run: |
          v="$(grep -m1 -oE 'Version:[[:space:]]*[0-9.]+' wc-product-sync.php | grep -oE '[0-9.]+')"
          [ -n "$v" ] || { echo "::error::no Version in plugin header"; exit 1; }
          echo "version=$v"

      # update.json's changelog must be the real notes for this version, not the "see CHANGELOG.md"
      # pointer — that field is what the store owner reads in the WP update modal. And it must be
      # valid JSON, or every store's update check silently fails.
      - name: update.json carries real release notes
        run: |
          python3 - <<'PY'
          import json, re
          v = None
          for line in open("wc-product-sync.php"):
              if "Version:" in line:
                  v = re.search(r"Version:\s*([0-9][0-9A-Za-z.-]*)", line).group(1); break
          # A prerelease (0.9.27-beta1) shares the changelog of its base version (0.9.27) — same
          # rule as scripts/changelog-section.sh. Strip the suffix before matching the heading.
          base = v.split("-", 1)[0]
          c = json.load(open("dist/update.json"))["sections"]["changelog"]
          assert c.strip().startswith(f"### {base}"), f"changelog does not open with the {base} section: {c[:60]!r}"
          assert "CHANGELOG.md" not in c[:40], "changelog is still a pointer, not the real notes"
          print(f"ok: update.json changelog is the {base} section ({len(c)} chars) for version {v}")
          PY
