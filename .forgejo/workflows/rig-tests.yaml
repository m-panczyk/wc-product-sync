name: Rig tests

# These drive REAL syncs against the live rig and MUTATE products on the source store,
# so they are deliberately NOT on push/PR. Manual or nightly only.
#
# The plugin enforces a global sync lock (wps_sync_running transient, full/fast mutually
# exclusive), so nothing here may run in parallel: one workflow run at a time (concurrency),
# and one rig job at a time within a run (needs:).
on:
  schedule:
    - cron: '17 2 * * *'   # nightly 02:17
  workflow_dispatch:
    inputs:
      run_perf:
        description: 'Also run the performance benchmark'
        type: boolean
        default: true

concurrency:
  group: wps-rig           # global: one rig, one job — never cancel a sync mid-flight
  cancel-in-progress: false

jobs:
  parity:
    runs-on: self-hosted
    outputs:
      rig_up: ${{ steps.gate.outputs.up }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rig SSH key
        env:
          SSH_KEY: ${{ secrets.RIG_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RIG_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::secret RIG_SSH_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The test scripts source tests/perf.env unconditionally, and it is gitignored
      # (real endpoints/tokens), so CI has to materialize it from secrets.
      - name: Materialize tests/perf.env
        env:
          QNAP_SSH: ${{ secrets.QNAP_SSH }}
          QNAP_DOCKER: ${{ secrets.QNAP_DOCKER }}
          QNAP_PROJECT: ${{ secrets.QNAP_PROJECT }}
          GRAFANA: ${{ secrets.GRAFANA }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          INFLUX: ${{ secrets.INFLUX }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
          SRC_SSH: ${{ secrets.SRC_SSH }}
          SRC_CONTAINER: ${{ secrets.SRC_CONTAINER }}
          SRC_PROJECT: ${{ secrets.SRC_PROJECT }}
        run: |
          umask 077
          : "${QNAP_SSH:?secret QNAP_SSH is not set}"
          : "${SRC_SSH:?secret SRC_SSH is not set}"
          for v in QNAP_SSH QNAP_DOCKER QNAP_PROJECT GRAFANA GRAFANA_TOKEN \
                   INFLUX INFLUX_ORG INFLUX_TOKEN SRC_SSH SRC_CONTAINER SRC_PROJECT; do
            printf '%s="%s"\n' "$v" "${!v}"
          done > tests/perf.env
          mkdir -p metrics

      # A real gate: records reachability as an output the later steps key off.
      # (The old version ssh'd with an unset var and then `exit 0`, which ends the
      # step successfully and runs the test anyway — it never actually skipped.)
      - name: Rig reachability gate
        id: gate
        env:
          QNAP_SSH: ${{ secrets.QNAP_SSH }}
        run: |
          if ssh -o BatchMode=yes -o ConnectTimeout=5 "$QNAP_SSH" true 2>/dev/null; then
            echo 'up=true' >> "$GITHUB_OUTPUT"
          else
            echo 'up=false' >> "$GITHUB_OUTPUT"
            echo '::warning::rig unreachable — skipping all rig tests'
          fi

      # Price and stock run as sequential STEPS, not parallel jobs: they contend for
      # the plugin's sync lock and would flake against each other.
      - name: Parity — price (tick)
        if: steps.gate.outputs.up == 'true'
        run: TEST_FIELD=price tests/sync-parity-test.sh tick

      - name: Parity — stock (tick)
        if: steps.gate.outputs.up == 'true'
        run: TEST_FIELD=stock tests/sync-parity-test.sh tick

      - name: Upload parity metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-metrics
          path: metrics/*.csv
          if-no-files-found: ignore

  perf:
    needs: parity              # serialize: never share the rig with the parity job
    if: needs.parity.outputs.rig_up == 'true' && (github.event_name == 'schedule' || inputs.run_perf)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install rig SSH key
        env:
          SSH_KEY: ${{ secrets.RIG_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RIG_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Materialize tests/perf.env
        env:
          QNAP_SSH: ${{ secrets.QNAP_SSH }}
          QNAP_DOCKER: ${{ secrets.QNAP_DOCKER }}
          QNAP_PROJECT: ${{ secrets.QNAP_PROJECT }}
          GRAFANA: ${{ secrets.GRAFANA }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          INFLUX: ${{ secrets.INFLUX }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
          SRC_SSH: ${{ secrets.SRC_SSH }}
          SRC_CONTAINER: ${{ secrets.SRC_CONTAINER }}
          SRC_PROJECT: ${{ secrets.SRC_PROJECT }}
        run: |
          umask 077
          for v in QNAP_SSH QNAP_DOCKER QNAP_PROJECT GRAFANA GRAFANA_TOKEN \
                   INFLUX INFLUX_ORG INFLUX_TOKEN SRC_SSH SRC_CONTAINER SRC_PROJECT; do
            printf '%s="%s"\n' "$v" "${!v}"
          done > tests/perf.env
          mkdir -p metrics

      # force_full=0 (incremental). A wipe+recreate baseline is a manual decision,
      # not something CI should do to the rig unattended.
      - name: Performance benchmark (incremental)
        run: tests/perf-run.sh ci 0

      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: metrics/*.csv
          if-no-files-found: ignore
