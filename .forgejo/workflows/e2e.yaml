name: E2E

# Hermetic end-to-end sync test: spins up two throwaway WooCommerce stores as sibling
# containers on the same DinD daemon that runs this job, syncs one into the other, and
# asserts parity. No rig, no SSH key, no secrets — safe on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: self-hosted
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          # iproute2: node:22-bookworm ships no `ip`, and the next step needs it to find
          # the DinD daemon on the default gateway.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg zip unzip python3 iproute2 bc >/dev/null
          # Docker's own repo — Debian ships no compose v2 plugin.
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            docker-ce-cli docker-compose-plugin >/dev/null
          docker --version && docker compose version

      - uses: actions/checkout@v4
        with:
          # perf.sh checks out the last release tag into a worktree to build the
          # baseline — a shallow clone has neither the tags nor the history.
          fetch-depth: 0

      # This job runs INSIDE DinD, so the daemon is reachable at the job's default
      # gateway. The stack comes up as siblings of this container, on that same daemon.
      - name: Point the Docker CLI at the DinD daemon
        run: |
          GW="$(ip route | awk '/default/{print $3}')"
          echo "DOCKER_HOST=tcp://$GW:2375" >> "$GITHUB_ENV"
          echo "daemon at tcp://$GW:2375"

      - name: Daemon reachable
        run: docker info --format 'server {{.ServerVersion}} / driver {{.Driver}}'

      - name: Bring up the stack
        run: tests/stack/up.sh

      - name: Seed the source catalog
        run: tests/stack/seed.sh

      - name: Sync + parity + force-full + image/empty-source safety
        run: tests/stack/e2e.sh

      # e2e.sh phase 4 EMPTIES THE SOURCE (that is the point — an empty source must not wipe
      # the target). perf.sh only resets the target, so without re-seeding it would time syncs
      # of an empty catalog and every ratio would be a meaningless 1.0.
      - name: Re-seed the source
        run: tests/stack/seed.sh

      # Paired A/B against the last release tag, on the same stack. Absolute timings here
      # are meaningless (shared NAS, DinD, vfs); the ratio is not.
      - name: Performance (baseline vs candidate)
        run: tests/stack/perf.sh

      # Last: it removes the plugin. Asserts the uninstall cleans up its own options/crons/
      # transients WITHOUT taking the product data (meta, image maps, soft-delete tag) with it.
      - name: Uninstall (cleanup + data preservation)
        run: tests/stack/uninstall.sh

      - name: Tear down
        if: always()
        run: tests/stack/down.sh || true
