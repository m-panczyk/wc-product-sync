name: WC Product Sync - Smoke Tests  
on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Check plugin syntax
        run: |
          echo "== WC Product Sync Syntax Check =="
          php -l wc-product-sync.php
          
      - name: Lint test files  
        run: |
          cd tests/
          for f in *.php; do
            php -l "$f" || exit 1
          done
          echo "All PHP syntax OK"
