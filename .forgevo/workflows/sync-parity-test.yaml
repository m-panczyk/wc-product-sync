name: WC Product Sync - Field Parity Tests
on: [push, pull_request]

jobs:
  parity-price:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Check rig connectivity  
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=5 "$QNAP_SSH" echo "pong" >/dev/null 2>&1; then
            echo "::warning::QNAP rig unreachable — skipping parity test"
            exit 0  
          fi

      - name: Run price field parity test (tick mode)
        env:
          QNAP_SSH: ${{ secrets.QNAP_SSH }}
          QNAP_DOCKER: ${{ secrets.QNAP_DOCKER }}
          QNAP_PROJECT: ${{ secrets.QNAP_PROJECT }}
        run: |
          cd tests/
          chmod +x sync-parity-test.sh  
          TEST_FIELD=price ./sync-parity-test.sh tick

  parity-stock:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Check rig connectivity  
        run: |
          if ! ssh -o BatchMode=yes -o ConnectTimeout=5 "$QNAP_SSH" echo "pong" >/dev/null 2>&1; then
            echo "::warning::QNAP rig unreachable — skipping parity test"
            exit 0
          fi

      - name: Run stock field parity test (tick mode)
        env:
          QNAP_SSH: ${{ secrets.QNAP_SSH }}  
          QNAP_DOCKER: ${{ secrets.QNAP_DOCKER }}
          QNAP_PROJECT: ${{ secrets.QNAP_PROJECT }}
        run: |
          cd tests/
          chmod +x sync-parity-test.sh
          TEST_FIELD=stock ./sync-parity-test.sh tick
